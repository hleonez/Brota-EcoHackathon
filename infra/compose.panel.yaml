# Panel de coordinación como servicio de Compose (archivos estáticos con nginx).
# El navegador de la coordinadora llama a la API en VITE_API_URL: en este equipo,
# http://localhost:${API_LOCAL_PORT}. Ese origen (http://localhost:3000) ya está en CORS.
services:
  panel:
    build:
      context: ../web/coordinacion
      args:
        VITE_API_URL: "http://localhost:${API_LOCAL_PORT:-8000}"
    ports:
      - target: 80
        published: "${PANEL_LOCAL_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
