# Blueprint de Brota en Render (Virginia). Los secretos van con sync: false:
# Render los pide al crear el Blueprint o se cargan por CLI desde api/.env y bot/.env.
# No escribas tokens, contraseñas ni el PIN en este archivo.
#
# El id de plan 0.5c-512mb es el cómputo de pago más pequeño. No se duerme.
# El plan gratuito sí se duerme y Meta dejaría de alcanzar el webhook.

services:
  - type: web
    name: brota-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health/live
    envVars:
      - key: MIGRAR_AL_INICIAR
        value: "true"
      - key: SEMBRAR_AL_INICIAR
        value: "true"
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: brota
      - key: DB_SSLMODE
        value: verify-full
      - key: PGSSLROOTCERT
        value: system
      - key: AVISOS_MODO
        value: pull
      - key: GEMINI_MODELO
        value: gemini-3.5-flash-lite
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SEED_PIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOT_SERVICE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: brota-bot
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    healthCheckPath: /health
    envVars:
      - key: BROTA_API_URL
        fromService:
          name: brota-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WHATSAPP_DRY_RUN
        value: "false"
      - key: AVISOS_ACTIVOS
        value: "true"
      - key: AVISOS_INTERVALO_SEGUNDOS
        value: "3"
      - key: LAB_ACTIVO
        value: "false"
      - key: COORDINACION_POR_WHATSAPP
        value: "false"
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: WHATSAPP_USAR_PLANTILLAS
        value: "false"
      - key: PLANTILLAS_IDIOMA
        value: es
      - key: BOT_SERVICE_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
