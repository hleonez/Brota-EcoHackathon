name: Infrastructure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/coordinacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/coordinacion/package-lock.json
      - run: npm ci
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        run: |
          docker version
          docker compose version
          python3 --version
          bash -n infra/test-infra.sh
      - name: Validate Compose and disposable database lifecycle
        run: bash infra/test-infra.sh
