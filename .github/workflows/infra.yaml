name: Infrastructure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        run: |
          docker version
          docker compose version
          python3 --version
          bash -n infra/test-infra.sh
      - name: Validate Compose and disposable database lifecycle
        run: bash infra/test-infra.sh
